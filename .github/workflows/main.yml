on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  setup:
    runs-on: macos-latest

    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4

      # Optional: show environment info
      - name: Show macOS environment
        run: |
          set -euxo pipefail
          sw_vers
          uname -a
          xcode-select -p || true

      # Run full macOS setup in order
      - name: Initialize macOS
        run: make all